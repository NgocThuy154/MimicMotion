name: Daily News Update & Email

on:
  schedule:
    - cron: '5 8 * * *' # 15:05 Vietnam (UTC+7)
  workflow_dispatch:

jobs:
  update-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Crawl news from CafeF
        working-directory: scripts
        run: node crawl-news.js

      - name: Send email summary
        working-directory: scripts
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: nguyenngocthuy154@gmail.com
        run: node send-email.js

      - name: Commit updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/news.json
          git diff --staged --quiet || git commit -m "chore: update daily news $(date +%Y-%m-%d)"
          git push

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project bctaichinh-c0af0
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
